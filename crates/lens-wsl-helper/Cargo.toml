[package]
name = "lens-wsl-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Session Lens WSL helper (Linux-side log streamer)"

[[bin]]
name = "lens-wsl-helper"
path = "src/main.rs"

[features]
fault_inject = []

[dependencies]
lens-core = { path = "../lens-core" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
jsonschema = "0.30"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
