[package]
name = "lens-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent Session Lens core: read-only ingestion of local agent session logs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
notify = "8"
walkdir = "2"
regex = "1"
file-id = "0.2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
jsonschema = "0.30"
sha2 = "0.10"
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_Threading"] }
